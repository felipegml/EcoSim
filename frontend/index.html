
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EcoSim — World Viewer</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="js/main.js" defer></script>
</head>
<body>
    <header>
        <div>
            <p class="eyebrow">ECOSYSTEM SIMULATOR</p>
            <h1>EcoSim</h1>
            <p class="subtitle">Explore your generated world.</p>
        </div>
        <div class="world-info">
            <span>WORLD SIZE</span>
            <strong id="world-size">Loading...</strong>
        </div>
    </header>

    <main>
        <section class="panel">
            <div class="panel-heading">
                <div>
                    <h2>World map</h2>
                    <p>Each square represents one terrain tile.</p>
                </div>
                <span id="world-status">Loading world...</span>
            </div>
            
            <div class="world-controls">
                <div class="control-grid">
                    <label>
                        Width
                        <input id="world-width" type="number" min="10" max="300" value="100">
                    </label>

                    <label>
                        Height
                        <input id="world-height" type="number" min="10" max="300" value="100">
                    </label>

                    <label>
                        Seed
                        <input id="seed-input" type="number" placeholder="Random seed">
                    </label>

                    <label>
                        Water smoothing
                        <input id="water-smoothing" type="number" min="1" max="30" value="10">
                    </label>
                </div>

                <h3>Terrain percentages</h3>

                <div class="control-grid terrain-controls">
                    <label>
                        Water (%)
                        <input id="terrain-water" type="number" min="0" max="100" value="15">
                    </label>

                    <label>
                        Grass (%)
                        <input id="terrain-grass" type="number" min="0" max="100" value="45">
                    </label>

                    <label>
                        Stone (%)
                        <input id="terrain-stone" type="number" min="0" max="100" value="15">
                    </label>

                    <label>
                        Dirt (%) — automatic
                        <input id="terrain-dirt" type="number" value="25" readonly>
                    </label>
                </div>

                <div class="generation-buttons">
                    <button id="generate-world" type="button">Generate World</button>
                    <button id="generate-random-world" type="button">Generate Random World</button>
                </div>
            </div>

            <div class="map-container">
                <canvas id="world-map" aria-label="Generated world terrain map"></canvas>
            </div>

            <div class="legend">
                <span><i class="grass"></i> Grass</span>
                <span><i class="dirt"></i> Dirt</span>
                <span><i class="water"></i> Water</span>
                <span><i class="stone"></i> Stone</span>
            </div>
        </section>
        
        <section class="panel statistics-panel">
            <div class="panel-heading">
                <div>
                    <h2>Terrain composition</h2>
                    <p>Actual tile counts compared with the configured world.</p>
                </div>
            </div>

            <div id="terrain-stats" class="terrain-stats"></div>
        </section>

    </main>
</body>
</html>
